org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Gradle's build cache hits a packing bug on this project
# ("Could not pack tree 'RClassOutputJar'"), which fails the build after a
# successful compile. There is nothing to gain from it for a single-developer
# app, so it stays off.
org.gradle.caching=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
