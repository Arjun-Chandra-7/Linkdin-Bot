line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # long lines are caught by the formatter, not worth failing CI over
    "B008",   # FastAPI's Depends() in defaults is the documented idiom
    "SIM108", # ternaries are not always clearer
]

[lint.per-file-ignores]
"tests/*" = ["E402"]      # sys.path is set up in conftest before imports
"scripts/*" = ["E402"]
